<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Two Card Draw</title>
<style>
  :root{
    --night: #171129;
    --night-2: #241a3d;
    --plum: #3a2a5c;
    --plum-light: #4d3878;
    --gold: #cba669;
    --gold-soft: #e6d3a8;
    --lavender: #b3a6cf;
    --ink: #0f0a1f;
    --display-font: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif;
    --body-font: Palatino, 'Palatino Linotype', Georgia, serif;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(ellipse at 50% -10%, #2d2050 0%, var(--night) 55%, var(--ink) 100%);
    color: var(--lavender);
    font-family: var(--body-font);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 20px;
    overflow-x: hidden;
  }

  .stars{
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,.5), transparent),
      radial-gradient(1px 1px at 80% 10%, rgba(255,255,255,.4), transparent),
      radial-gradient(1.5px 1.5px at 60% 70%, rgba(255,255,255,.6), transparent),
      radial-gradient(1px 1px at 30% 80%, rgba(255,255,255,.35), transparent),
      radial-gradient(1px 1px at 90% 60%, rgba(255,255,255,.4), transparent),
      radial-gradient(1.5px 1.5px at 45% 35%, rgba(255,255,255,.5), transparent);
    background-repeat: repeat;
    background-size: 600px 600px;
    opacity: .8;
  }

  h1{
    font-family: var(--display-font);
    font-weight: 600;
    font-size: clamp(28px, 5vw, 42px);
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--gold-soft);
    margin: 0 0 4px;
    text-align: center;
    z-index: 1;
  }

  .subtitle{
    font-style: italic;
    color: var(--lavender);
    opacity: .75;
    margin: 0 0 44px;
    letter-spacing: .02em;
    z-index: 1;
    text-align: center;
  }

  .table{
    display: flex;
    gap: 40px;
    flex-wrap: wrap;
    justify-content: center;
    z-index: 1;
    perspective: 1400px;
  }

  .slot{
    width: 200px;
  }

  .card{
    position: relative;
    width: 200px;
    height: 320px;
    border-radius: 14px;
    cursor: default;
    transform-style: preserve-3d;
    transition: transform 1s cubic-bezier(.2,.8,.2,1);
  }

  .card.flipped{
    transform: rotateY(180deg);
  }

  .face{
    position: absolute;
    inset: 0;
    border-radius: 14px;
    backface-visibility: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 18px;
    text-align: center;
  }

  .back{
    background:
      repeating-linear-gradient(45deg, var(--plum) 0 8px, var(--plum-light) 8px 16px);
    border: 2px solid var(--gold);
    box-shadow: 0 10px 30px rgba(0,0,0,.5), inset 0 0 0 6px var(--night);
  }

  .back::after{
    content: "✦";
    color: var(--gold-soft);
    font-size: 34px;
  }

  .front{
    background: linear-gradient(160deg, #2a2048, #171129 70%);
    border: 2px solid var(--gold-soft);
    transform: rotateY(180deg);
    box-shadow: 0 10px 30px rgba(0,0,0,.55);
  }

  .front .glyph{
    font-size: 40px;
    margin-bottom: 10px;
    color: var(--gold-soft);
  }

  .front .name{
    font-family: var(--display-font);
    font-weight: 600;
    font-size: 20px;
    letter-spacing: .04em;
    color: var(--gold-soft);
    margin: 0 0 4px;
  }

  .front .orientation{
    font-style: italic;
    font-size: 13px;
    color: var(--gold);
    text-transform: uppercase;
    letter-spacing: .12em;
    margin-bottom: 10px;
  }

  .front .art{
    width: 92px;
    height: 92px;
    margin-bottom: 6px;
    color: var(--gold-soft);
    transition: transform .6s ease;
  }

  .front .art svg{
    width: 100%;
    height: 100%;
    display: block;
    fill: none;
    stroke: currentColor;
    stroke-width: 2.4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .front .art.reversed{
    transform: rotate(180deg);
  }

  .label{
    text-align: center;
    margin-top: 14px;
    font-style: italic;
    font-size: 14px;
    color: var(--gold);
    letter-spacing: .06em;
    text-transform: uppercase;
    opacity: 0;
    transition: opacity .6s ease .4s;
  }

  .label.show{ opacity: .85; }

  button{
    z-index: 1;
    margin-top: 48px;
    background: transparent;
    border: 1.5px solid var(--gold);
    color: var(--gold-soft);
    font-family: var(--display-font);
    font-size: 16px;
    letter-spacing: .12em;
    text-transform: uppercase;
    padding: 14px 36px;
    border-radius: 999px;
    cursor: pointer;
    transition: background .3s ease, color .3s ease, box-shadow .3s ease;
  }

  button:hover{
    background: var(--gold);
    color: var(--ink);
    box-shadow: 0 0 24px rgba(203,166,105,.5);
  }

  button:focus-visible{
    outline: 2px solid var(--gold-soft);
    outline-offset: 4px;
  }

  @media (prefers-reduced-motion: reduce){
    .card{ transition: none; }
  }
</style>
</head>
<body>

<div class="stars"></div>

<h1>Two Card Draw</h1>
<p class="subtitle">Ask your question, then turn the cards</p>

<div class="table">
  <div class="slot">
    <div class="card" id="card1">
      <div class="face back"></div>
      <div class="face front">
        <div class="art" id="art1"></div>
        <div class="name" id="name1"></div>
        <div class="orientation" id="orient1"></div>
      </div>
    </div>
    <div class="label" id="label1">First card</div>
  </div>
  <div class="slot">
    <div class="card" id="card2">
      <div class="face back"></div>
      <div class="face front">
        <div class="art" id="art2"></div>
        <div class="name" id="name2"></div>
        <div class="orientation" id="orient2"></div>
      </div>
    </div>
    <div class="label" id="label2">Second card</div>
  </div>
</div>

<button id="drawBtn">Draw two cards</button>

<script>
  const majorDeck = [
    { name: "The Fool", art: '<svg viewBox="0 0 100 100"><path d="M20 70 Q50 75 80 70"/><circle cx="50" cy="32" r="12"/><path d="M50 44 L50 62"/><path d="M50 50 L38 58"/><path d="M50 50 L64 44"/><path d="M50 62 L42 70"/></svg>' },
    { name: "The Magician", art: '<svg viewBox="0 0 100 100"><path d="M28 62 a12 10 0 1 0 24 0 a12 10 0 1 0 -24 0"/><path d="M48 62 a12 10 0 1 0 24 0 a12 10 0 1 0 -24 0"/><path d="M50 30 L50 62"/><path d="M50 30 L40 22 M50 30 L60 22"/></svg>' },
    { name: "The High Priestess", art: '<svg viewBox="0 0 100 100"><path d="M50 25 a22 22 0 1 0 0 44 a17 17 0 1 1 0 -44 z"/><path d="M22 78 L22 40" /><path d="M78 78 L78 40"/></svg>' },
    { name: "The Empress", art: '<svg viewBox="0 0 100 100"><circle cx="50" cy="60" r="18"/><path d="M50 42 L42 26 L50 32 L58 26 Z"/><path d="M32 60 Q22 60 20 48"/><path d="M68 60 Q78 60 80 48"/></svg>' },
    { name: "The Emperor", art: '<svg viewBox="0 0 100 100"><rect x="30" y="40" width="40" height="34" rx="3"/><path d="M30 40 L24 26 M40 40 L36 24 M50 40 L50 22 M60 40 L64 24 M70 40 L76 26"/></svg>' },
    { name: "The Hierophant", art: '<svg viewBox="0 0 100 100"><circle cx="34" cy="34" r="9"/><path d="M34 43 L34 78"/><path d="M26 60 L42 60"/><circle cx="66" cy="52" r="9"/><path d="M66 61 L66 78"/><path d="M58 70 L74 70"/></svg>' },
    { name: "The Lovers", art: '<svg viewBox="0 0 100 100"><path d="M40 58 a13 13 0 1 1 0.1 0 z"/><path d="M60 58 a13 13 0 1 1 0.1 0 z"/><path d="M50 30 L50 45"/><path d="M42 30 L58 30"/></svg>' },
    { name: "The Chariot", art: '<svg viewBox="0 0 100 100"><circle cx="32" cy="66" r="12"/><circle cx="68" cy="66" r="12"/><path d="M32 54 L68 54 L60 30 L40 30 Z"/><path d="M50 30 L50 18"/></svg>' },
    { name: "Strength", art: '<svg viewBox="0 0 100 100"><path d="M50 24 a12 9 0 1 0 0.1 0 z"/><path d="M28 66 Q50 46 72 66 Q50 82 28 66 Z"/></svg>' },
    { name: "The Hermit", art: '<svg viewBox="0 0 100 100"><path d="M50 26 L58 46 L42 46 Z"/><rect x="38" y="46" width="24" height="26" rx="2"/><path d="M50 72 L50 80"/><path d="M32 82 Q50 76 68 82"/></svg>' },
    { name: "Wheel of Fortune", art: '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="26"/><circle cx="50" cy="50" r="6"/><path d="M50 24 L50 76 M24 50 L76 50 M32 32 L68 68 M68 32 L32 68"/></svg>' },
    { name: "Justice", art: '<svg viewBox="0 0 100 100"><path d="M50 22 L50 78"/><path d="M26 34 L74 34"/><path d="M26 34 L18 52 L34 52 Z"/><path d="M74 34 L66 52 L82 52 Z"/><path d="M36 78 L64 78"/></svg>' },
    { name: "The Hanged Man", art: '<svg viewBox="0 0 100 100"><path d="M24 26 L76 26"/><path d="M50 26 L50 46"/><circle cx="50" cy="56" r="10"/><path d="M50 66 L38 82 M50 66 L62 82"/><path d="M50 66 L40 60 M50 66 L60 60"/></svg>' },
    { name: "Death", art: '<svg viewBox="0 0 100 100"><circle cx="50" cy="42" r="16"/><path d="M40 40 a3 3 0 1 0 0.1 0z M60 40 a3 3 0 1 0 0.1 0z"/><path d="M42 50 Q50 56 58 50"/><path d="M38 58 L38 78 M46 58 L46 82 M54 58 L54 82 M62 58 L62 78"/></svg>' },
    { name: "Temperance", art: '<svg viewBox="0 0 100 100"><path d="M26 44 L34 74 L46 74 L38 44 Z"/><path d="M54 26 L62 56 L74 56 L66 26 Z"/><path d="M38 50 Q50 40 62 42"/></svg>' },
    { name: "The Devil", art: '<svg viewBox="0 0 100 100"><path d="M50 30 a16 14 0 1 0 0.1 0z"/><path d="M38 24 Q34 14 26 16 M62 24 Q66 14 74 16"/><path d="M40 34 L44 38 M60 34 L56 38"/><path d="M40 74 L34 88 M60 74 L66 88"/></svg>' },
    { name: "The Tower", art: '<svg viewBox="0 0 100 100"><rect x="38" y="34" width="24" height="46"/><path d="M38 50 L62 50"/><path d="M50 34 L50 20"/><path d="M50 20 L40 10 M50 20 L60 10"/><path d="M30 84 L38 68 M70 84 L62 68"/></svg>' },
    { name: "The Star", art: '<svg viewBox="0 0 100 100"><path d="M50 22 L56 40 L74 40 L60 51 L65 70 L50 59 L35 70 L40 51 L26 40 L44 40 Z"/><path d="M24 82 Q50 74 76 82"/></svg>' },
    { name: "The Moon", art: '<svg viewBox="0 0 100 100"><path d="M58 26 a26 26 0 1 0 0 48 a20 20 0 1 1 0 -48 z"/><path d="M22 84 Q40 70 30 60 Q46 66 50 78"/></svg>' },
    { name: "The Sun", art: '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="16"/><path d="M50 18 L50 26 M50 74 L50 82 M18 50 L26 50 M74 50 L82 50 M28 28 L34 34 M66 66 L72 72 M72 28 L66 34 M34 66 L28 72"/></svg>' },
    { name: "Judgement", art: '<svg viewBox="0 0 100 100"><path d="M40 40 L64 40 L64 32 L78 44 L64 56 L64 48 L40 48 Z"/><circle cx="50" cy="72" r="12"/><path d="M50 60 L50 52"/></svg>' },
    { name: "The World", art: '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="26"/><path d="M50 24 a13 26 0 1 0 0.1 0z"/><path d="M24 50 L76 50"/></svg>' },
  ];

  // --- Minor Arcana: generated from a small set of suit glyphs and rank emblems ---

  const SUIT_GLYPH = {
    wands: '<path d="M10 2 L10 18 M10 7 L6 4 M10 7 L14 4 M10 13 L6 10 M10 13 L14 10" vector-effect="non-scaling-stroke"/>',
    cups: '<path d="M5 3 Q5 11 10 11 Q15 11 15 3 Z M10 11 L10 16 M6 18 L14 18 M10 16 L10 18" vector-effect="non-scaling-stroke"/>',
    swords: '<path d="M10 1 L10 14 M6 5 L14 5 M8 14 L12 14 M10 14 L10 18" vector-effect="non-scaling-stroke"/>',
    pentacles: '<circle cx="10" cy="10" r="9" vector-effect="non-scaling-stroke"/><path d="M10 3 L14.11 15.66 L3.34 7.84 L16.66 7.84 L5.89 15.66 Z" vector-effect="non-scaling-stroke"/>',
  };

  const RANK_EMBLEM = {
    page: '<path d="M40 16 L40 34" vector-effect="non-scaling-stroke"/><path d="M40 16 L58 22 L40 28 Z" vector-effect="non-scaling-stroke"/>',
    knight: '<path d="M38 32 Q50 14 62 32 L57 35 Q50 23 43 35 Z" vector-effect="non-scaling-stroke"/>',
    queen: '<path d="M34 32 L40 18 L50 28 L60 18 L66 32 Z" vector-effect="non-scaling-stroke"/><path d="M34 32 L66 32" vector-effect="non-scaling-stroke"/>',
    king: '<path d="M32 32 L36 15 L44 26 L50 12 L56 26 L64 15 L68 32 Z" vector-effect="non-scaling-stroke"/><path d="M32 32 L68 32" vector-effect="non-scaling-stroke"/>',
  };

  const PIP_LAYOUTS = {
    1: [[50,52]],
    2: [[50,26],[50,78]],
    3: [[50,20],[50,52],[50,84]],
    4: [[32,26],[68,26],[32,78],[68,78]],
    5: [[32,26],[68,26],[50,52],[32,78],[68,78]],
    6: [[32,20],[68,20],[32,52],[68,52],[32,84],[68,84]],
    7: [[32,18],[68,18],[50,34],[32,52],[68,52],[32,84],[68,84]],
    8: [[32,16],[68,16],[32,38],[68,38],[32,60],[68,60],[32,82],[68,82]],
    9: [[32,14],[68,14],[32,34],[68,34],[50,48],[32,62],[68,62],[32,84],[68,84]],
    10: [[32,12],[68,12],[32,29],[68,29],[32,46],[68,46],[32,63],[68,63],[32,80],[68,80]],
  };

  function pipArt(suitKey, count){
    const scale = count <= 1 ? 1.6 : count <= 3 ? 1.15 : count <= 6 ? 0.85 : 0.62;
    const glyphs = PIP_LAYOUTS[count].map(([x, y]) =>
      `<g transform="translate(${x - 10 * scale} ${y - 10 * scale}) scale(${scale})">${SUIT_GLYPH[suitKey]}</g>`
    ).join('');
    return `<svg viewBox="0 0 100 100">${glyphs}</svg>`;
  }

  function courtArt(suitKey, rankKey){
    return `<svg viewBox="0 0 100 100">${RANK_EMBLEM[rankKey]}<path d="M30 44 L70 44"/><g transform="translate(32 48) scale(1.8)">${SUIT_GLYPH[suitKey]}</g></svg>`;
  }

  const SUITS = [
    { key: "wands", label: "Wands" },
    { key: "cups", label: "Cups" },
    { key: "swords", label: "Swords" },
    { key: "pentacles", label: "Pentacles" },
  ];

  const NUMERIC_RANKS = ["Ace","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten"];

  const COURT_RANKS = [
    { key: "page", label: "Page" },
    { key: "knight", label: "Knight" },
    { key: "queen", label: "Queen" },
    { key: "king", label: "King" },
  ];

  const minorDeck = [];
  SUITS.forEach(suit => {
    NUMERIC_RANKS.forEach((rankLabel, idx) => {
      minorDeck.push({ name: `${rankLabel} of ${suit.label}`, art: pipArt(suit.key, idx + 1) });
    });
    COURT_RANKS.forEach(rank => {
      minorDeck.push({ name: `${rank.label} of ${suit.label}`, art: courtArt(suit.key, rank.key) });
    });
  });

  const deck = [...majorDeck, ...minorDeck];

  const btn = document.getElementById('drawBtn');
  const cards = [document.getElementById('card1'), document.getElementById('card2')];
  const labels = [document.getElementById('label1'), document.getElementById('label2')];

  function fillCard(i, cardData, reversed){
    const artEl = document.getElementById('art' + (i+1));
    artEl.innerHTML = cardData.art;
    artEl.classList.toggle('reversed', reversed);
    document.getElementById('name' + (i+1)).textContent = cardData.name;
    document.getElementById('orient' + (i+1)).textContent = reversed ? "Reversed" : "Upright";
  }

  function drawTwo(){
    btn.disabled = true;

    cards.forEach(c => c.classList.remove('flipped'));
    labels.forEach(l => l.classList.remove('show'));

    const shuffled = [...deck].sort(() => Math.random() - .5);
    const picks = [shuffled[0], shuffled[1]];

    picks.forEach((cardData, i) => {
      const reversed = Math.random() < 0.35;
      fillCard(i, cardData, reversed);
    });

    setTimeout(() => {
      cards[0].classList.add('flipped');
      labels[0].classList.add('show');
    }, 200);

    setTimeout(() => {
      cards[1].classList.add('flipped');
      labels[1].classList.add('show');
    }, 650);

    setTimeout(() => { btn.disabled = false; }, 1400);
  }

  btn.addEventListener('click', drawTwo);
</script>

</body>
</html>
